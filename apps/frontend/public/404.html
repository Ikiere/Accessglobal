<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aisle Not Found (404) — AccessGlobal Market</title>
    <meta name="description" content="The workshop parcel or category you requested does not exist or has been relocated to another international depot." />
    <link rel="canonical" href="https://accessglobalmarket.com/404.html" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-bg: #fbfaf8;
        --color-surface: #ffffff;
        --color-ink: #121516;
        --color-ink-muted: #50565a;
        --color-accent: #124330;
        --color-line: rgba(18, 21, 22, 0.09);
        --font-display: "Instrument Serif", Georgia, serif;
        --font-body: "Plus Jakarta Sans", system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--color-bg);
        color: var(--color-ink);
        font-family: var(--font-body);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: var(--color-surface);
        padding: 48px;
        border-radius: 12px;
        border: 1px solid var(--color-line);
        max-width: 480px;
        box-shadow: 0 4px 12px rgba(18, 21, 22, 0.05);
      }
      h1 {
        font-family: var(--font-display);
        font-size: 2.5rem;
        margin-bottom: 12px;
      }
      p {
        color: var(--color-ink-muted);
        line-height: 1.6;
        margin-bottom: 24px;
      }
      a {
        display: inline-block;
        background-color: var(--color-accent);
        color: #ffffff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: 500;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Aisle Not Found</h1>
      <p>The workshop parcel or category you requested does not exist or has been relocated to another international depot.</p>
      <a href="/">Return to AccessGlobal Home</a>
    </div>
  </body>
</html>
